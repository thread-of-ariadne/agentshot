<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root { --bg: #fbfaf8; --side: #f4f3f1; --ink: #1c1b1f; --muted: #8a8791; --line: #ebe9ee; --accent: #6d5ce8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; height: 100vh; display: flex; overflow: hidden; user-select: none; }
  aside { width: 232px; background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px; flex: none; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; padding: 0 8px 18px; }
  .brand i { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, #8b7bff, #5a48d6); }
  .nav { font-size: 13.5px; font-weight: 500; }
  .nav div { padding: 7px 10px; border-radius: 8px; display: flex; align-items: center; gap: 9px; color: #4a4850; }
  .nav div.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .nav div b { margin-left: auto; font-weight: 500; color: var(--muted); font-size: 12px; }
  .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 22px 10px 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 14px; padding: 22px 36px 16px; position: relative; }
  header h1 { font-size: 22px; font-weight: 700; }
  header h1 span { color: var(--muted); font-weight: 500; margin-left: 8px; font-size: 18px; }
  .chips { display: flex; gap: 6px; }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 9px 4px 8px; border-radius: 99px; background: #fff; border: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
  .btn { margin-left: auto; font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: #fff; padding: 7px 12px; border-radius: 9px; display: flex; gap: 7px; align-items: center; cursor: default; }
  .btn.active { border-color: var(--accent); color: var(--accent); }
  .btn2 { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: var(--ink); color: #fff; padding: 8px 13px; border-radius: 9px; }
  .list { padding: 4px 36px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 6px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 500; }
  .ring { width: 18px; height: 18px; border-radius: 50%; border: 1.6px solid #c9c6d0; flex: none; }
  .row .when { margin-left: auto; font-size: 12px; color: var(--muted); width: 90px; text-align: right; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 99px; display: flex; gap: 6px; align-items: center; width: 92px; }
  .pop {
    position: absolute; right: 150px; top: 62px; width: 260px; background: #fff; border-radius: 14px; z-index: 5;
    box-shadow: 0 20px 50px rgba(30, 20, 60, .16), 0 0 0 1px rgba(0,0,0,.05); padding: 10px; display: none;
  }
  .pop.open { display: block; }
  .pop h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px 8px; font-weight: 600; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; font-size: 13.5px; font-weight: 500; }
  .opt .box { margin-left: auto; width: 18px; height: 18px; border-radius: 5px; border: 1.6px solid #cfccd6; }
  .opt.on { background: #f5f3ff; }
  .opt.on .box { background: var(--accent); border-color: var(--accent); position: relative; }
  .opt.on .box::after { content: ""; position: absolute; left: 5px; top: 1.5px; width: 4px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .pop .foot { display: flex; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 8px; padding: 10px 6px 2px; font-size: 13px; }
  .pop .foot a { color: var(--accent); font-weight: 600; }
  .empty { padding: 40px 6px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<aside>
  <div class="brand"><i></i>Daybook</div>
  <div class="nav">
    <div>Inbox<b>4</b></div>
    <div class="on">Today<b>9</b></div>
    <div>Upcoming</div>
    <div>Someday</div>
  </div>
  <div class="sec">Labels</div>
  <div class="nav" id="side-labels"></div>
</aside>
<main>
  <header>
    <h1>Today<span>Fri, Sep 18</span></h1>
    <div class="chips" id="chips"></div>
    <button class="btn" id="filter" data-shot="filter">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1.5 3h11M3.5 7h7M5.5 11h3"/></svg>
      Filter</button>
    <button class="btn2">+ New task</button>
    <div class="pop" id="pop" data-shot="pop">
      <h3>Label colors</h3>
      <div id="opts"></div>
      <div class="foot"><span style="color:var(--muted)" id="count">All labels</span><a id="clear" data-shot="clear">Clear</a></div>
    </div>
  </header>
  <div class="list" id="list"></div>
</main>
<script>
  const LABELS = {
    Family: ['#ec5b8a', '#ffe8ef', '#9c1f4a'], Work: ['#4f7cf0', '#e6eeff', '#1f3f9c'],
    Errands: ['#f3a93a', '#fff3df', '#8a5300'], Health: ['#2fb36a', '#e3f6ea', '#17643a'],
    Personal: ['#9b6cf0', '#f1eaff', '#5326a6'],
  };
  const TASKS = [
    ['Plan a low-key birthday afternoon', 'Family', '11:00 AM'], ['Design review with Priya', 'Work', '10:00 AM'],
    ['Order groceries', 'Errands', '5:30 PM'], ['Call the dentist', 'Health', '2:00 PM'],
    ['Book flights for Thanksgiving', 'Family', 'Anytime'], ['Write the launch announcement', 'Work', '9:00 AM'],
    ['Pick up dry cleaning', 'Errands', '6:00 PM'], ['Evening run', 'Health', '7:30 PM'],
    ['Video call with Mom', 'Family', '8:00 PM'], ['Sketch the iPad widget idea', 'Personal', 'Anytime'],
  ];
  const active = new Set();
  const tag = n => `<span class="tag" style="background:${LABELS[n][1]};color:${LABELS[n][2]}"><span class="dot" style="background:${LABELS[n][0]}"></span>${n}</span>`;

  document.getElementById('side-labels').innerHTML = Object.keys(LABELS)
    .map(n => `<div><span class="dot" style="background:${LABELS[n][0]}"></span>${n}</div>`).join('');
  document.getElementById('opts').innerHTML = Object.keys(LABELS)
    .map(n => `<div class="opt" data-label="${n}" data-shot="opt-${n.toLowerCase()}"><span class="dot" style="background:${LABELS[n][0]}"></span>${n}<span class="box"></span></div>`).join('');

  function render() {
    const rows = TASKS.filter(t => active.size === 0 || active.has(t[1]));
    document.getElementById('list').innerHTML = rows.length
      ? rows.map(t => `<div class="row"><span class="ring"></span>${t[0]}<span class="when">${t[2]}</span>${tag(t[1])}</div>`).join('')
      : '<div class="empty">Nothing here.</div>';
    document.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', active.has(o.dataset.label)));
    document.getElementById('chips').innerHTML = [...active].map(tag).join('');
    document.getElementById('filter').classList.toggle('active', active.size > 0);
    document.getElementById('count').textContent = active.size ? `${rows.length} tasks shown` : 'All labels';
  }
  document.getElementById('filter').addEventListener('click', () => document.getElementById('pop').classList.toggle('open'));
  document.getElementById('opts').addEventListener('click', e => {
    const o = e.target.closest('.opt'); if (!o) return;
    active.has(o.dataset.label) ? active.delete(o.dataset.label) : active.add(o.dataset.label);
    render();
  });
  document.getElementById('clear').addEventListener('click', () => { active.clear(); render(); });
  render();
</script>
</body>
</html>
